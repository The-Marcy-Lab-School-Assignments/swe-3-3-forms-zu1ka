

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
   
</head>
<body>

<main>

   <h1>NYC Tech Summit 2026</h1>
    <p>March 15, 2026 | 9:00 - 5:00 PM | Manhattan Conference Center </p>

    <form action="">
       <h2>Event RSVP</h2>
       

       

        <div class="form-grid">
        <div class="field">
            <label for="First-Name">First Name: </label>
            <input type="text" required name="" id="First-Name">
</div>
            <div class="field">

            <label for="Last-Name">Last Name: </label> 
               <input type="text" required name="" id="Last-Name">
</div>
      

          
               
            <div class="field">
            <label for="Email">Email: </label>
            <input type="email" name="" id="Email">
</div>

            <div class="field">
               <label for="Number-of-Tickets">Number of Tickets</label>
               <input type="number" required name="" id="Number-of-Tickets"  min="1" max="10" value="1">

</div>
</div>
        
       

       <fieldset>
        <legend>Lunch Preference</legend>

        <div>
        <input type="radio" id="Chicken" name="lunch">
        <label for="Chicken">Chicken</label>
        </div>
        <div>
        <input type="radio" id="Fish" name="lunch">
        <label for="Fish">Fish</label>
        </div>

        <div>
        <input type="radio" id="Vegetarian" name="lunch">
        <label for="Vegetarian">Vegetarian</label>
        </div>
       </fieldset>

       <fieldset>
         <legend>Select Workshop Sessions(Check all that apply)</legend>
         <div>
         <input type="checkbox" name="session-1" id="session-1">
         <label for="session-1">Session 1</label>
         </div>

         <div>
         <input type="checkbox" name="session-2" id="session-2">
         <label for="session-2">Session 2</label>
         </div>

         <div>
         <input type="checkbox" name="session-3" id="session-3">
         <label for="session-3">Session 3</label>
            </div>

            <div>
         <input type="checkbox" name="session-4" id="session-4">
         <label for="session-4">Session 4</label>
                </div>

                <div>
         <input type="checkbox" name="session-5" id="session-5">
         <label for="session-5">Session 5</label>
                </div>




       </fieldset>
 
       
       <label for="Special-request">Special Requests or Notes</label> <br>
        <textarea name="Special-request" id="Special-request" placeholder="Dietary restrictions, accessibility needs, questions, etc."></textarea>

             <button type="submit">Complete RSVP</button>


    </form>




</main>
<footer>Copyright @ 2026 NYC Tech summit</footer>
    
</body>
</html>
